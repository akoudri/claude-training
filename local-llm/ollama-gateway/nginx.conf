# Passerelle entre le réseau "agents" (dev containers, sans accès Internet) et Ollama.
# N'expose que ce dont Claude Code a besoin : l'API Messages compatible Anthropic.
# Tout le reste de l'API Ollama (pull, push, create, delete, ...) est refusé : un agent
# ne peut ni faire sortir de données par un registre externe, ni supprimer les modèles de la stack.
server {
    listen 8080;
    client_max_body_size 50m;

    # Résolution à chaque requête (DNS interne de Docker) : si le conteneur ollama est recréé
    # et change d'adresse, la passerelle suit sans redémarrage.
    resolver 127.0.0.11 valid=10s;
    set $ollama http://ollama:11434;

    location = /v1/messages {
        limit_except POST { deny all; }
        proxy_pass $ollama;
        proxy_http_version 1.1;
        proxy_buffering off;          # réponses en streaming
        proxy_read_timeout 1800s;     # modèle local lent : longues générations
        proxy_send_timeout 1800s;
    }

    location = /v1/messages/count_tokens {
        limit_except POST { deny all; }
        proxy_pass $ollama;
        proxy_http_version 1.1;
    }

    location = /api/version {
        limit_except GET { deny all; }
        proxy_pass $ollama;
    }

    location / {
        return 403;
    }
}
