# Service optionnel n8n : agents (AI Agent node + outils + PGVector Vector Store), utilisé par
# l'agent de conformité du tutoriel 03.
# Activation : ajouter docker-compose.n8n.yml à COMPOSE_FILE dans .env (voir .env.example), par exemple
#   COMPOSE_FILE=docker-compose.yml:docker-compose.n8n.yml
#   COMPOSE_FILE=docker-compose.yml:docker-compose.vulkan.yml:docker-compose.n8n.yml
# (sous Windows hors WSL, le séparateur est ";")
#
# La base "n8n" est créée par le service postgres de docker-compose.yml, que n8n soit activé ou non.
services:
  n8n:
    restart: unless-stopped
    image: n8nio/n8n:2.41.6
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/documents;/data/reports;/data/config
    volumes:
      - n8n:/home/node/.n8n
      - ./documents:/data/documents:ro # documents à indexer (exclus de git)
      - ./reports:/data/reports # rapports de conformité (exclus de git)
      - ./n8n/config:/data/config:ro # dictionnaire et destinataire (exclus de git)
    ports: ["127.0.0.1:5678:5678"]
    depends_on:
      postgres: { condition: service_healthy }
      ollama: { condition: service_healthy }

volumes: { n8n: {} }
