# Stack LLM locale agentique + RAG
# Fonctionne sur toute machine avec Docker (Linux, macOS, Windows/WSL2). Par défaut, Ollama tourne
# sur le CPU ; un profil GPU s'ajoute par COMPOSE_FILE dans .env (voir .env.example) :
#   docker-compose.vulkan.yml : GPU AMD ou Intel, intégré ou dédié (Linux, via Vulkan)
#   docker-compose.nvidia.yml : GPU NVIDIA (Linux ou WSL2, NVIDIA Container Toolkit requis)
# n8n est optionnel et s'ajoute de la même façon : docker-compose.n8n.yml (tutoriel 03). De même pour Docling,
# qui améliore la lecture des PDF par Open WebUI : docker-compose.docling.yml (tutoriel 01, section 6.2.1).
# Configuration de référence des mesures citées dans les tutoriels :
#   Ryzen 7 7840HS + iGPU Radeon 780M (profil vulkan, mémoire partagée GTT ~16 Go), 30 Go de RAM.
#
#   ollama      : inférence
#   ollama-init : télécharge le modèle de chat et le modèle d'embedding au démarrage
#   postgres    : base n8n + base "rag" avec pgvector (vector store partagé)
#   open-webui  : chat + RAG documentaire (vecteurs dans pgvector)
#   open-webui-init : applique au modèle de base les réglages du tutoriel 01 et, si OPENWEBUI_EXEMPLES=true,
#                     crée la base et l'assistant d'exemple (open-webui/configurer.py), puis s'arrête
#   ollama-gateway : seule porte d'entrée des dev containers (réseau "agents", sans Internet)
#                    vers Ollama, limitée à l'API Messages (voir ollama-gateway/nginx.conf)
#
# Démarrage : cp .env.example .env  (puis éditer)  &&  docker compose up -d

x-restart: &restart
  restart: unless-stopped

services:
  ollama:
    <<: *restart
    image: ollama/ollama:latest
    # Accès au GPU : voir docker-compose.vulkan.yml et docker-compose.nvidia.yml.
    environment:
      - OLLAMA_KEEP_ALIVE=30m         # évite de recharger le modèle entre deux appels d'agent
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-16384} # agents + RAG : contexte long nécessaire
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0      # divise ~par 2 la mémoire du cache KV
      - OLLAMA_MAX_LOADED_MODELS=2     # modèle de chat + modèle d'embedding simultanément
      - OLLAMA_NUM_PARALLEL=1          # une requête à la fois, sinon la mémoire du contexte est multipliée
      - OLLAMA_NO_CLOUD=1              # pas de modèles ":cloud" : sinon une requête vers un tel modèle part sur ollama.com
    volumes: [ollama:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]
    mem_limit: ${OLLAMA_MEM_LIMIT:-20g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-init:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${LLM_MODEL} && ollama pull ${EMBED_MODEL}"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama: { condition: service_healthy }
    restart: "no"

  postgres:
    <<: *restart
    image: pgvector/pgvector:pg16
    # 64 Mo par défaut : trop peu pour créer l'index ivfflat d'Open WebUI sur document_chunk
    command: ["postgres", "-c", "maintenance_work_mem=256MB"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n
    volumes:
      - pg:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # Exposé en local uniquement, sur 5433 pour ne pas gêner un Postgres déjà installé sur l'hôte
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  open-webui:
    <<: *restart
    image: ghcr.io/open-webui/open-webui:main
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # Compte administrateur créé au premier démarrage (inscriptions ensuite fermées). Vides : le premier
      # compte créé dans l'interface devient administrateur, et open-webui-init ne configure rien.
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL:-}
      - WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD:-}
      - ENABLE_OPENAI_API=false
      - DEFAULT_MODELS=${LLM_MODEL}
      # RAG : embeddings calculés par Ollama, vecteurs stockés dans pgvector
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=${EMBED_MODEL}
      - RAG_OLLAMA_BASE_URL=http://ollama:11434
      - VECTOR_DB=pgvector
      - PGVECTOR_DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/rag
      # Les variables suivantes ne sont lues qu'au PREMIER démarrage (PersistentConfig, tutoriel 01, section 2) :
      # ensuite, c'est la base d'Open WebUI qui fait foi, et on les modifie dans l'interface d'administration.
      # Embeddings par lots de 32, deux requêtes à la fois : sinon une requête par extrait, toutes lancées en
      # même temps, et un gros PDF épuise les descripteurs de fichiers ("Too many open files").
      - RAG_EMBEDDING_BATCH_SIZE=32
      - RAG_EMBEDDING_CONCURRENT_REQUESTS=2
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=150
      - ENABLE_RAG_HYBRID_SEARCH=true  # BM25 + vecteurs, meilleur sur du contenu technique
      - RAG_TOP_K=8
      - RAG_TOP_K_RERANKER=8           # en recherche hybride, le plus petit des deux Top K s'applique
      # Tâches d'arrière-plan (tutoriel 01, section 4) : chacune occupe Ollama, qui ne traite qu'une requête à la fois
      - ENABLE_FOLLOW_UP_GENERATION=false
      - ENABLE_TAGS_GENERATION=false
      - ENABLE_SEARCH_QUERY_GENERATION=false
      - ENABLE_AUTOCOMPLETE_GENERATION=false
      - ENABLE_RETRIEVAL_QUERY_GENERATION=true
    volumes: [openwebui:/app/backend/data]
    ports: ["127.0.0.1:3000:8080"]
    depends_on:
      ollama: { condition: service_healthy }
      postgres: { condition: service_healthy }

  open-webui-init:
    image: ghcr.io/open-webui/open-webui:main   # pour son Python : rien d'Open WebUI n'est importé
    entrypoint: ["python3", "/init/configurer.py"]
    environment:
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL:-}
      - WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD:-}
      - LLM_MODEL=${LLM_MODEL}
      - OPENWEBUI_EXEMPLES=${OPENWEBUI_EXEMPLES:-false}
    volumes:
      - ./open-webui:/init:ro
      - ./n8n/exemples:/exemples:ro
    depends_on:
      open-webui: { condition: service_healthy }
      ollama-init: { condition: service_completed_successfully }  # bge-m3 requis pour indexer les exemples
    restart: "no"

  ollama-gateway:
    <<: *restart
    image: nginx:1.29-alpine
    volumes:
      - ./ollama-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, agents]
    depends_on:
      ollama: { condition: service_healthy }

volumes: { ollama: {}, openwebui: {}, pg: {} }

networks:
  default: {}
  # Réseau des dev containers d'agents de code : "internal" = aucune route vers Internet
  # et aucune résolution DNS de noms externes. Seule la passerelle y est joignable.
  # Nom fixe (sinon préfixé par le nom du dossier) : le dev container le rejoint par ce nom.
  agents:
    name: llm-agents
    internal: true

